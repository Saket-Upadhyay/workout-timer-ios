name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test on iPhone Simulator
    # The project uses the Xcode 27 file format (objectVersion 110) and targets iOS 27,
    # which macos-latest (macOS 26 / Xcode 26.x) cannot open.
    runs-on: xcode-27

    env:
      PROJECT: WorkoutTimer.xcodeproj
      SCHEME: WorkoutTimer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read)["devices"]
            ios = devices.select { |rt, _| rt.include?("iOS") }.sort_by { |rt, _| rt.scan(/\d+/).map(&:to_i) }.reverse
            iphone = ios.flat_map { |_, list| list }.find { |d| d["name"].start_with?("iPhone") }
            abort "No iPhone simulator available" unless iphone
            STDERR.puts "Using #{iphone["name"]} (#{iphone["udid"]})"
            puts iphone["udid"]')
          echo "DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO
